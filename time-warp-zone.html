<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Time Warp Zone — Watch by Time Type</title>

<style>

:root{
  --navy:#0b1f33;
  --gold:#d4af37;
  --cream:#f4e7c1;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#0b1f33;
  color:white;
  font-family:Arial, Helvetica, sans-serif;
}

.wrapper{
  width:100%;
  max-width:1500px;
  margin:0 auto;
  padding:10px 14px 12px;
}

h2{
  margin:0 0 9px;
  text-align:center;
  font-family:Georgia, "Times New Roman", serif;
  font-size:19px;
  font-weight:normal;
  color:#f4e7c1;
}

.strip{
  display:grid;
  grid-template-columns:repeat(8, 1fr);
  gap:7px;
}

.card{
  position:relative;
  display:block;
  overflow:hidden;
  aspect-ratio:2.4 / 1;
  background:#071522;
  border-bottom:3px solid #d4af37;
  text-decoration:none;
  color:white;
}

.card img{
  width:100%;
  height:100%;
  display:block;
  object-fit:cover;
}

.overlay{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  padding:12px 5px 4px;
  text-align:center;
  font-size:11px;
  font-weight:bold;
  line-height:1.05;
  background:linear-gradient(
    to bottom,
    rgba(11,31,51,0),
    rgba(11,31,51,.90)
  );
}

.overlay span{
  display:block;
  margin-top:2px;
  font-size:9px;
  font-weight:normal;
  color:#e1e1e1;
}

@media(max-width:900px){
  .strip{
    grid-template-columns:repeat(4,1fr);
  }
}

@media(max-width:520px){
  .strip{
    grid-template-columns:repeat(2,1fr);
  }
}

</style>
</head>

<body>

<div class="wrapper">

<h2>Watch Time Warp Zone by Time Type</h2>

<div class="strip">

<a class="card"
href="https://youtube.com/shorts/YuqOwe0SGMc"
target="_blank">
<img src="WeekendRaider.png" alt="WeekendRaider">
<div class="overlay">
Borrowed Time
<span>WeekendRaider</span>
</div>
</a>

<a class="card"
href="https://youtube.com/shorts/XQnDFSfCpPo"
target="_blank">
<img src="GoneGrinding.png" alt="GoneGrinding">
<div class="overlay">
Clock-In Time
<span>GoneGrinding</span>
</div>
</a>

<a class="card"
href="https://youtube.com/shorts/P9Xx2mTRYXo"
target="_blank">
<img src="CrowdedVonDinghy.png" alt="CrowdedVonDinghy">
<div class="overlay">
Connected Time
<span>CrowdedVonDinghy</span>
</div>
</a>

<a class="card"
href="https://youtube.com/shorts/Qr5_1MO-6w4"
target="_blank">
<img src="NorthWhere.png" alt="NorthWhere">
<div class="overlay">
Exploration Time
<span>NorthWhere</span>
</div>
</a>

<a class="card"
href="https://youtube.com/shorts/X8gXHjnHQk0"
target="_blank">
<img src="PrecisionSundial.png" alt="PrecisionSundial">
<div class="overlay">
Mastery Time
<span>PrecisionSundial</span>
</div>
</a>

<a class="card"
href="https://youtube.com/shorts/wuaaKD5h5zg"
target="_blank">
<img src="FiveMinWarning.png" alt="FiveMinWarning">
<div class="overlay">
Overtime
<span>FiveMinWarning</span>
</div>
</a>

<a class="card"
href="https://youtube.com/shorts/qfgU-6zhkU0?feature=share"
target="_blank">
<img src="LilThriller.png" alt="LilThriller">
<div class="overlay">
Play Time
<span>LilThriller</span>
</div>
</a>

<a class="card"
href="https://youtube.com/shorts/azoKctrlTfM"
target="_blank">
<img src="PlayerOne.png" alt="PlayerOne">
<div class="overlay">
Recovery Time
<span>PlayerOne</span>
</div>
</a>

</div>
</div>

</body>
</html>
